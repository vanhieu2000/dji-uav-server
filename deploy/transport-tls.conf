load_module /usr/lib/nginx/modules/ngx_stream_module.so;
worker_processes auto;
events { worker_connections 2048; }
stream {
    # Use a factory-trusted certificate; verify Pilot 2 supports MQTTS/RTMPS before enabling.
    ssl_certificate /etc/uav-tls/fullchain.pem;
    ssl_certificate_key /etc/uav-tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:transport:10m;
    limit_conn_zone $binary_remote_addr zone=per_peer:10m;
    server {
        listen 8883 ssl;
        limit_conn per_peer 30;
        proxy_connect_timeout 10s;
        proxy_timeout 1h;
        proxy_pass backend:1883;
    }
    server {
        listen 1936 ssl;
        limit_conn per_peer 30;
        proxy_connect_timeout 10s;
        proxy_timeout 1h;
        proxy_pass backend:1935;
    }
}
